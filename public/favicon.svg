<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="medfolio-grad" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="cross-accent" x1="16" y1="16" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f766e" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Base Folio Card -->
  <rect x="4" y="4" width="40" height="40" rx="10" fill="url(#medfolio-grad)" filter="url(#glow)" />

  <!-- Inner Folio Fold Line -->
  <path d="M12 10C12 7.79086 13.7909 6 16 6H32C34.2091 6 36 7.79086 36 10V38C36 40.2091 34.2091 42 32 42H16C13.7909 42 12 40.2091 12 38V10Z" fill="white" fill-opacity="0.12" />

  <!-- Medical Cross / Plus Symbol with Soft Rounded Joints -->
  <path d="M24 14V34M14 24H34" stroke="white" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Center Pulse Dot -->
  <circle cx="24" cy="24" r="2.5" fill="url(#cross-accent)" />
</svg>
