<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Medfolio — Medical Records & Prescription Manager</title>
    <meta name="description" content="Personal medical records, prescription digitization, dose reminders, and lab report tracking." />
    
    <!-- PWA & Mobile Meta Tags -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0F766E" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Medfolio" />
    <link rel="apple-touch-icon" href="/logo.svg" />

    <!--
      Resolve the theme before first paint. Waiting for React to hydrate would
      show a flash of the light theme to every dark-mode user on every load.
      The storage key must match THEME_STORAGE_KEY in src/lib/theme/ThemeProvider.tsx.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('medfolio_theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = stored === 'dark' || ((!stored || stored === 'system') && prefersDark);
          if (isDark) {
            document.documentElement.classList.add('dark');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#2b2724');
          }
        } catch (e) {
          /* Blocked storage: fall back to the light theme. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
