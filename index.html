<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Medfolio — Medical Records & Prescription Manager</title>
    <meta name="description" content="Personal medical records, prescription digitization, dose reminders, and lab report tracking." />
    
    <!-- PWA & Mobile Meta Tags -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0F766E" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Medfolio" />
    <link rel="apple-touch-icon" href="/logo.svg" />

    <script>
      (function () {
        try {
          // Permanently clear any stored dark mode preference and guarantee light theme
          localStorage.removeItem('medfolio_theme');
          document.documentElement.classList.remove('dark');
        } catch (e) {
          // ignore
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
